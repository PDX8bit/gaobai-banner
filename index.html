<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>告白横幅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one full-bleed stage. LED marquee at the back, a popup layer in the middle, the giant heart on top. */
:root {
  --bg: #0b0608;
  --led: #ff4d7a;
  --glow: rgba(255, 42, 95, 0.6);
  --paper: #fff4f1;
  --ink: #2a0f18;
  --accent: #ffc2cf;
  --muted-ink: #6b5a60;
  --font-display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  /* Lace: a repeating eyelet-flower tile and a scalloped edge, both drawn in the pale pink accent. */
  --lace-tile: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72' fill='none' stroke='%23ffc2cf' stroke-width='1.1'><g transform='translate(36 36)'><circle r='3.5'/><ellipse cy='-11' rx='4' ry='7'/><ellipse cy='-11' rx='4' ry='7' transform='rotate(60)'/><ellipse cy='-11' rx='4' ry='7' transform='rotate(120)'/><ellipse cy='-11' rx='4' ry='7' transform='rotate(180)'/><ellipse cy='-11' rx='4' ry='7' transform='rotate(240)'/><ellipse cy='-11' rx='4' ry='7' transform='rotate(300)'/></g><g id='c'><circle r='1.8'/><ellipse cy='-5' rx='2.2' ry='4.5'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(90)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(180)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(270)'/></g><g transform='translate(72 0)'><circle r='1.8'/><ellipse cy='-5' rx='2.2' ry='4.5'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(90)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(180)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(270)'/></g><g transform='translate(0 72)'><circle r='1.8'/><ellipse cy='-5' rx='2.2' ry='4.5'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(90)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(180)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(270)'/></g><g transform='translate(72 72)'><circle r='1.8'/><ellipse cy='-5' rx='2.2' ry='4.5'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(90)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(180)'/><ellipse cy='-5' rx='2.2' ry='4.5' transform='rotate(270)'/></g></svg>");
  --lace-scallop: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='32' viewBox='0 0 36 32' fill='none' stroke='%23ffc2cf' stroke-opacity='.7' stroke-width='1'><path d='M0 2.5H36'/><path d='M0 12H36'/><path d='M0 12A18 13 0 0 0 36 12'/><path d='M7 12A11 7 0 0 0 29 12'/><path d='M13 12A5 3 0 0 0 23 12'/></svg>");
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: var(--font-body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

#stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); container-type: size; }
/* Portrait phones: turn the whole stage 90deg so the banner always reads as landscape. */
#stage.rot { inset: auto; top: 0; left: 0; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }

/* Lace background */
#lace {
  position: absolute; inset: 0; pointer-events: none;
  background-image: var(--lace-tile); background-size: 72px 72px;
  opacity: .2;
  -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, .3) 0%, #000 100%);
  mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, .3) 0%, #000 100%);
}
.lace-edge {
  position: absolute; left: 0; right: 0; height: 32px; z-index: 3; pointer-events: none;
  background-image: var(--lace-scallop); background-repeat: repeat-x; background-size: 36px 32px;
}
.lace-edge.top { top: 0; }
.lace-edge.bot { bottom: 0; transform: scaleY(-1); }
#heart::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: var(--lace-tile); background-size: 72px 72px; opacity: .14;
}
#heart .lace-edge { z-index: 1; }

/* LED marquee */
#marquee { position: absolute; inset: 0; overflow: hidden; }
#marquee::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--bg) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--bg) 1.5px, transparent 1.5px);
  background-size: 7px 7px;
}
#ticker {
  position: absolute; left: 0; top: 50%;
  transform: translate3d(100vw, -50%, 0);
  white-space: nowrap;
  font-family: var(--font-display);
  font-size: max(110px, min(40cqh, 32cqw));
  line-height: 1.1;
  color: var(--led);
  text-shadow: 0 0 .12em var(--glow), 0 0 .4em var(--glow);
  will-change: transform;
}
#marquee.static { display: flex; align-items: center; justify-content: center; }
#marquee.static #ticker {
  position: static; transform: none !important; white-space: normal; text-align: center;
  font-size: min(14cqw, 90px); padding: 0 16px;
}

/* Popups, styled like old desktop dialog windows */
#layer { position: absolute; inset: 0; overflow: hidden; z-index: 5; transition: opacity .5s; }
#layer.out { opacity: 0; pointer-events: none; }

.pop {
  --w: min(86cqw, 520px);
  position: absolute; left: 50%; top: 50%;
  width: var(--w);
  font-size: calc(var(--w) / 20);
  transform: translate(-50%, -50%);
  background: var(--paper); color: var(--ink);
  border: .14em solid var(--ink);
  box-shadow: .3em .3em 0 var(--led);
  animation: pop-in .28s cubic-bezier(.2, 1.4, .4, 1) both;
  transition: width .8s cubic-bezier(.2, .9, .2, 1), font-size .8s cubic-bezier(.2, .9, .2, 1);
}
.pop.big { --w: min(96cqw, 780px, 150cqh); }
@keyframes pop-in {
  from { transform: translate(-50%, -50%) scale(.6); opacity: 0; }
  to   { transform: translate(-50%, -50%) scale(1);  opacity: 1; }
}
.bar { display: flex; align-items: center; gap: .6em; padding: .45em .7em; background: var(--led); color: var(--ink); }
.dots { display: flex; gap: .3em; }
.dots i { width: .5em; height: .5em; background: var(--ink); }
.ttl { font-size: .62em; font-weight: 700; letter-spacing: .08em; }
.body { padding: 1.1em 1.2em 1.3em; text-align: center; }
.msg { margin: 0 0 .9em; font-family: var(--font-display); font-size: 1.45em; line-height: 1.35; text-wrap: balance; }
.btns { display: flex; gap: .8em; justify-content: center; }
.pop button {
  font: inherit; font-family: var(--font-body); font-weight: 700; font-size: 1em;
  min-height: 44px; padding: .55em 1.3em; cursor: pointer;
  border: .1em solid var(--ink); color: var(--ink); background: transparent;
}
.pop .yes { background: var(--led); box-shadow: .18em .18em 0 var(--ink); }
.pop .no { color: var(--muted-ink); }
.pop button:active { transform: translate(.1em, .1em); box-shadow: none; }
.pop button:focus-visible { outline: .15em solid var(--ink); outline-offset: .15em; }
.pop.solo .no { display: none; }
.pop.solo .yes { flex: 1; font-size: 1.25em; }

/* Giant heart */
#heart {
  position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 50% 45%, #3a0716 0%, var(--bg) 72%);
}
.heart-box {
  position: relative; width: calc(min(100cqw, 100cqh) * 1.12); max-width: none;
  filter: drop-shadow(0 0 5vmin var(--glow));
  animation: heart-in .9s cubic-bezier(.2, 1.3, .4, 1) both, beat 1.1s ease-in-out .9s infinite;
}
.heart-box svg { display: block; width: 100%; height: auto; }
.heart-text {
  position: absolute; left: 0; right: 0; top: 40%; text-align: center;
  font-family: var(--font-display); font-size: calc(min(100cqw, 100cqh) * .13); color: var(--paper);
}
@keyframes heart-in { from { transform: scale(0) rotate(-14deg); } to { transform: scale(1) rotate(0); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
#floaters { position: absolute; inset: 0; pointer-events: none; }
#floaters span {
  position: absolute; bottom: -10%; left: 0; opacity: 0;
  font-size: var(--s); color: var(--c);
  animation: rise var(--d) linear var(--dl) infinite;
}
@keyframes rise {
  0% { transform: translateY(0); opacity: 0; }
  10% { opacity: .8; }
  100% { transform: translateY(-120cqh) rotate(20deg); opacity: 0; }
}

#hint, #again { position: absolute; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#hint {
  margin: 0; padding: .4em .9em; font-size: 15px; font-weight: 700; letter-spacing: .1em;
  color: var(--ink); background: var(--accent); pointer-events: none; animation: nudge 1.2s ease-in-out infinite;
}
@keyframes nudge { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
#again {
  min-height: 44px; padding: 0 1.2em; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  color: var(--paper); background: transparent; border: 2px solid var(--accent);
}
#again:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .pop, .heart-box { animation: none; }
  .pop { transition: none; }
  #floaters { display: none; }
  #hint { animation: none; }
}
</style>

<main id="stage">
  <div id="lace" aria-hidden="true"></div>
  <div id="marquee"><div id="ticker">秦梦瑶，我喜欢你❤️</div></div>
  <div class="lace-edge top" aria-hidden="true"></div>
  <div class="lace-edge bot" aria-hidden="true"></div>
  <div id="layer"></div>
  <div id="heart" role="img" aria-label="一个巨大的爱心" hidden>
    <div class="lace-edge top" aria-hidden="true"></div>
    <div class="lace-edge bot" aria-hidden="true"></div>
    <div id="floaters"></div>
    <div class="heart-box">
      <svg viewBox="0 0 100 90" aria-hidden="true">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff6b8e"/>
            <stop offset="1" stop-color="#e0113f"/>
          </linearGradient>
        </defs>
        <path fill="url(#hg)" d="M50 86 C20 62 2 44 2 26 C2 12 13 3 26 3 C37 3 46 9 50 18 C54 9 63 3 74 3 C87 3 98 12 98 26 C98 44 80 62 50 86 Z"/>
      </svg>
      <span class="heart-text">说好啦</span>
    </div>
  </div>
  <p id="hint" hidden>点一个吧</p>
  <button id="again" type="button" hidden>再看一次</button>
</main>

<script>
(function () {
  var SCROLL_PASSES = 2;
  var TEXTS = ['秦梦瑶，我喜欢你❤️', '可以做做做做我的女朋友吗！'];
  var SPEED = 2.5;       // text heights per second (was 5, now half speed)
  var ASK = '秦梦瑶，<br>可以做我的女朋友吗！';
  var PICK = '不好的挑走了，<br>那只有好的了';
  var COPIES = 46;

  var $ = function (s) { return document.querySelector(s); };
  var stage = $('#stage'), marquee = $('#marquee'), ticker = $('#ticker'), layer = $('#layer');
  var heart = $('#heart'), hint = $('#hint'), again = $('#again');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var runId = 0, raf = 0;

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function pass(dir, id) {
    return new Promise(function (res) {
      var V = stage.clientWidth, W = ticker.offsetWidth;
      var fs = parseFloat(getComputedStyle(ticker).fontSize);
      var from = dir < 0 ? V : -W, to = dir < 0 ? -W : V;
      var dur = Math.abs(to - from) / (fs * SPEED) * 1000;
      var t0 = performance.now();
      function tick(now) {
        if (id !== runId) return res();
        var p = Math.min(1, (now - t0) / dur);
        ticker.style.transform = 'translate3d(' + (from + (to - from) * p) + 'px,-50%,0)';
        if (p < 1) raf = requestAnimationFrame(tick); else res();
      }
      raf = requestAnimationFrame(tick);
    });
  }

  function buildPop(title, msg, solo) {
    var el = document.createElement('div');
    el.className = 'pop' + (solo ? ' solo' : '');
    el.innerHTML =
      '<div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="ttl"></span></div>' +
      '<div class="body"><p class="msg"></p><div class="btns">' +
      '<button type="button" class="yes">我愿意</button>' +
      '<button type="button" class="no">不愿意</button></div></div>';
    el.querySelector('.ttl').textContent = title;
    el.querySelector('.msg').innerHTML = msg;
    return el;
  }

  function reset() {
    cancelAnimationFrame(raf);
    layer.innerHTML = '';
    layer.classList.remove('out');
    heart.hidden = true;
    hint.hidden = true;
    again.hidden = true;
    marquee.classList.remove('static');
    ticker.textContent = TEXTS[0];
    ticker.style.transform = 'translate3d(100vw,-50%,0)';
  }

  async function run() {
    var id = ++runId;
    reset();
    try { await Promise.race([document.fonts.ready, wait(1500)]); } catch (e) {}
    if (id !== runId) return;
    if (reduce) {
      marquee.classList.add('static');
      for (var j = 0; j < TEXTS.length; j++) {
        ticker.textContent = TEXTS[j];
        await wait(2200);
        if (id !== runId) return;
      }
    } else {
      for (var i = 0; i < SCROLL_PASSES; i++) {
        ticker.textContent = TEXTS[i % TEXTS.length];
        ticker.style.transform = 'translate3d(' + stage.clientWidth + 'px,-50%,0)';
        await pass(-1, id); // every pass runs right to left
        if (id !== runId) return;
      }
    }
    showAsk(id);
  }

  function showAsk(id) {
    var pop = buildPop('提示', ASK, false);
    layer.appendChild(pop);
    pop.querySelector('.no').addEventListener('click', function () { onNo(pop, id); }, { once: true });
  }

  async function onNo(pop, id) {
    if (id !== runId) return;
    pop.querySelector('.msg').innerHTML = PICK;
    pop.classList.add('solo', 'big');
    await wait(1000);
    if (id !== runId) return;
    await cascade(id);
  }

  async function cascade(id) {
    var n = reduce ? 8 : COPIES;
    var delay = 420;
    for (var i = 1; i <= n; i++) {
      if (id !== runId) return;
      var c = buildPop('提示 (' + i + ')', PICK, true);
      c.style.left = rand(8, 92) + '%';
      c.style.top = rand(8, 92) + '%';
      c.style.setProperty('--w', 'min(70cqw,' + Math.round(rand(240, 400)) + 'px)');
      layer.appendChild(c);
      await wait(reduce ? 120 : delay);
      delay = Math.max(40, delay * 0.88);
    }
    if (id !== runId) return;
    var last = buildPop('提示 (' + (n + 1) + ')', PICK, true);
    last.classList.add('big');
    layer.appendChild(last);
    hint.hidden = false;
  }

  function floaters() {
    var box = $('#floaters');
    box.innerHTML = '';
    for (var i = 0; i < 30; i++) {
      var s = document.createElement('span');
      s.textContent = '♥';
      s.style.left = rand(0, 100) + '%';
      s.style.setProperty('--s', Math.round(rand(14, 48)) + 'px');
      s.style.setProperty('--d', rand(4, 9).toFixed(1) + 's');
      s.style.setProperty('--dl', rand(0, 3).toFixed(1) + 's');
      s.style.setProperty('--c', Math.random() < 0.5 ? 'var(--led)' : 'var(--accent)');
      box.appendChild(s);
    }
  }

  function heartBurst() {
    runId++;
    cancelAnimationFrame(raf);
    hint.hidden = true;
    layer.classList.add('out');
    floaters();
    heart.hidden = false;
    setTimeout(function () { again.hidden = false; }, 5000);
  }

  function layout() {
    var portrait = window.innerHeight > window.innerWidth;
    stage.classList.toggle('rot', portrait);
    stage.style.width = portrait ? window.innerHeight + 'px' : '';
    stage.style.height = portrait ? window.innerWidth + 'px' : '';
  }
  layout();
  window.addEventListener('resize', layout);

  layer.addEventListener('click', function (e) {
    if (e.target.closest('.yes')) heartBurst();
  });
  again.addEventListener('click', run);

  run();
})();
</script>

</body></html>
